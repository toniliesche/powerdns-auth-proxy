services:
  postgres:
    image: postgres:17.4
    environment:
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
    restart: no
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
    driver: local

networks:
  default:
    external: true
    name: pdns-network
